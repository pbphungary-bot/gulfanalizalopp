<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Golf Coach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="stage">
    <div class="phone">
      <main class="screens" id="screens">
        <section class="screen" id="s-home"></section>
        <section class="screen" id="s-coach" hidden></section>
        <section class="screen" id="s-play" hidden></section>
        <section class="screen" id="s-perf" hidden></section>
        <section class="screen" id="s-profile" hidden></section>
      </main>
      <nav class="tabbar" role="tablist" aria-label="Sections" id="tabbar">
        <button class="tab" role="tab" type="button" data-tab="home" aria-selected="true"><span class="i">◉</span>Home</button>
        <button class="tab" role="tab" type="button" data-tab="coach" aria-selected="false"><span class="i">◈</span>Coach</button>
        <button class="tab" role="tab" type="button" data-tab="play" aria-selected="false"><span class="i">⛳</span>Play</button>
        <button class="tab" role="tab" type="button" data-tab="perf" aria-selected="false"><span class="i">▥</span>My Game</button>
      </nav>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
